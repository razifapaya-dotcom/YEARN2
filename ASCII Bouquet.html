<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII Bouquet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&display=swap">
<style>
:root{--bg:#06040b;--ink:#ffe9d6;--dim:#a98fa0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#cap{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);text-align:center;font:italic 500 clamp(26px,5vw,40px) 'Playfair Display',Georgia,serif;color:var(--ink);outline:none;padding:4px 12px;opacity:0;transition:opacity 2.5s}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);text-align:center;font:12px system-ui,sans-serif;color:var(--dim)}
#rp{font:inherit;color:var(--ink);background:none;border:1px solid var(--dim);border-radius:99px;padding:2px 10px;margin-right:8px}
</style>
</head>
<body>
<div id="cap" contenteditable="true" spellcheck="false">Hai Alisaaaa.I heard flowers can make a day a little more beautiful. So, I thought of you. </div>
<div id="hint"><button id="rp">↻ replay</button>tap the flowers: ASCII ⇄ pixels</div>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
<script>
// ======== PART 1: ASCII shader (turns brightness into characters . : * o & 8 @ #) ========
const FRAG = `
precision highp float;
varying vec2 vTextureCoord;
uniform vec4 filterArea;
uniform float pixelSize;
uniform sampler2D uSampler;
vec2 mapCoord(vec2 c){ c *= filterArea.xy; c += filterArea.zw; return c; }
vec2 unmapCoord(vec2 c){ c -= filterArea.zw; c /= filterArea.xy; return c; }
float character(float n, vec2 p){
  p = floor(p * vec2(4.0, -4.0) + 2.5);
  if (clamp(p.x, 0.0, 4.0) == p.x && clamp(p.y, 0.0, 4.0) == p.y){
    if (int(mod(n / exp2(p.x + 5.0 * p.y), 2.0)) == 1) return 1.0;
  }
  return 0.0;
}
void main(){
  vec2 coord = mapCoord(vTextureCoord);
  vec2 cell = floor(coord / pixelSize) * pixelSize;
  // look at 4 spots inside each square and average them, so colors stay smooth
  vec4 c = (texture2D(uSampler, unmapCoord(cell + pixelSize * vec2(0.25, 0.25)))
          + texture2D(uSampler, unmapCoord(cell + pixelSize * vec2(0.75, 0.25)))
          + texture2D(uSampler, unmapCoord(cell + pixelSize * vec2(0.25, 0.75)))
          + texture2D(uSampler, unmapCoord(cell + pixelSize * vec2(0.75, 0.75)))) * 0.25;
  float gray = clamp(dot(c.rgb, vec3(0.3, 0.59, 0.11)) * 1.6, 0.0, 1.0);
  float n = 65536.0;
  if (gray > 0.2) n = 65600.0;
  if (gray > 0.3) n = 332772.0;
  if (gray > 0.4) n = 15255086.0;
  if (gray > 0.5) n = 23385164.0;
  if (gray > 0.6) n = 15252014.0;
  if (gray > 0.7) n = 13199452.0;
  if (gray > 0.8) n = 11512810.0;
  vec2 m = mod(coord, vec2(pixelSize)) / pixelSize;
  float k = character(n, vec2(-1.0) + m * 2.0);
  gl_FragColor = vec4(min(c.rgb * 1.3, vec3(c.a)) * k, c.a * k);
}`;

// ======== PART 2: Paint the bouquet realistically on a normal 2D canvas ========
const W = 600, H = 820, G = { x: 300, y: 800 };
const css = (c, k = 1, a = 1) => `rgba(${c.map(v => Math.min(255, Math.round(v * k))).join()},${a})`;
const R2 = Math.PI * 2;

function lily(c, x, y, L, base, deep, throat, rot) {
  c.save(); c.translate(x, y); c.rotate(rot);
  const petal = (a, len, wid, k, freckles) => {
    c.save(); c.rotate(a);
    c.beginPath(); c.moveTo(0, 0);
    c.bezierCurveTo(wid, -len * .22, wid * 1.05, -len * .7, wid * .12, -len * .97);
    c.quadraticCurveTo(0, -len * 1.04, -wid * .12, -len * .97);
    c.bezierCurveTo(-wid * 1.05, -len * .7, -wid, -len * .22, 0, 0); c.closePath();
    let g = c.createLinearGradient(0, 0, 0, -len);           // dark throat -> bright tip
    g.addColorStop(0, css(throat, k)); g.addColorStop(.18, css(deep, k));
    g.addColorStop(.55, css(base, k * .95)); g.addColorStop(1, css(base, k * 1.12));
    c.fillStyle = g; c.fill(); c.save(); c.clip();
    g = c.createLinearGradient(-wid, 0, wid, 0);              // rounded edges = 3D feeling
    g.addColorStop(0, 'rgba(0,0,0,.32)'); g.addColorStop(.3, 'rgba(0,0,0,0)');
    g.addColorStop(.5, 'rgba(255,255,255,.14)'); g.addColorStop(.7, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.32)');
    c.fillStyle = g; c.fillRect(-wid * 1.2, -len * 1.1, wid * 2.4, len * 1.2);
    c.strokeStyle = css(deep, k * .9, .55); c.lineWidth = len * .022;   // center groove
    c.beginPath(); c.moveTo(0, -len * .05); c.lineTo(0, -len * .78); c.stroke();
    c.lineWidth = 1; c.strokeStyle = css(deep, k, .28);                 // fine veins
    for (let i = -3; i <= 3; i++) if (i) { c.beginPath(); c.moveTo(0, -len * .05); c.quadraticCurveTo(i * wid * .18, -len * .4, i * wid * .12, -len * .9); c.stroke(); }
    if (freckles) { c.fillStyle = css(deep, .45, .85);                  // lily freckles
      for (let i = 0; i < 34; i++) { const fy = -len * (.1 + Math.random() * .5); c.beginPath(); c.arc((Math.random() - .5) * wid * (1.2 - Math.abs(fy) / len), fy, 1 + Math.random() * 1.4, 0, R2); c.fill(); } }
    c.restore(); c.restore();
  };
  for (let i = 0; i < 3; i++) petal(i * 2.094 + 1.047, L * .95, L * .25, .72, false);  // back petals (darker)
  for (let i = 0; i < 3; i++) petal(i * 2.094, L, L * .28, 1, true);                   // front petals
  for (let i = 0; i < 6; i++) {                                                        // stamens
    const s = i % 2 ? 1 : -1, len = L * .62; c.save(); c.rotate((i - 2.5) * .28);
    c.strokeStyle = 'rgb(250,240,205)'; c.lineWidth = 2.4; c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(L * .05 * s, -len * .5, 0, -len); c.stroke();
    c.translate(0, -len); c.rotate(1.2 * s); c.fillStyle = 'rgb(120,48,20)'; c.beginPath(); c.ellipse(0, 0, L * .075, L * .022, 0, 0, R2); c.fill();
    c.fillStyle = 'rgba(255,170,60,.9)'; for (let j = 0; j < 5; j++) { c.beginPath(); c.arc((j - 2) * L * .026, (Math.random() - .5) * 2, 1.6, 0, R2); c.fill(); }
    c.restore();
  }
  c.strokeStyle = 'rgb(235,235,170)'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(L * .08, -L * .35, 0, -L * .72); c.stroke();
  c.fillStyle = 'rgb(200,210,120)'; c.beginPath(); c.arc(0, -L * .72, 4.5, 0, R2); c.fill();
  c.restore();
}

function rose(c, x, y, R, b) {
  c.save(); c.translate(x, y);
  [[6, 1], [5, .82], [5, .64], [4, .48], [3, .33], [3, .2]].forEach(([n, r], k) => {   // layers, outside -> inside
    for (let i = 0; i < n; i++) {
      c.save(); c.rotate(i / n * R2 + k * .9 + Math.random() * .3); c.translate(0, -R * r * .45);
      const pw = R * r * .62, ph = R * r * .55;
      if (k) { c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = R * .09; }
      const g = c.createLinearGradient(0, -ph, 0, ph);
      g.addColorStop(0, css(b, 1.3)); g.addColorStop(.45, css(b, 1)); g.addColorStop(1, css(b, .5));
      c.beginPath(); c.ellipse(0, 0, pw, ph, 0, 0, R2); c.fillStyle = g; c.fill();
      c.shadowBlur = 0; c.shadowColor = 'transparent';
      c.beginPath(); c.ellipse(0, 0, pw, ph, 0, 3.45, 5.97); c.strokeStyle = css(b, 1.5, .55); c.lineWidth = 1.6; c.stroke();  // soft rim light
      c.restore();
    }
  });
  c.strokeStyle = css(b, .35, .7); c.lineWidth = 1.4; c.beginPath();                      // little swirl in the middle
  for (let t = 0; t < 14; t += .2) c.lineTo(Math.cos(t) * t * R * .016, Math.sin(t) * t * R * .016);
  c.stroke(); c.restore();
}

const rnd = (a, b) => a + Math.random() * (b - a);

// Lily leaf: long, narrow, pointed, with veins running along its length
function leafLily(c, x, y, ang, len, bend) {
  c.save(); c.translate(x, y); c.rotate(ang);
  const w = len * .1, N = 18, A = [], B = [];
  const sp = t => [bend * len * t * t, -len * t];                              // the curved spine of the leaf
  const wd = t => w * Math.sin(Math.PI * Math.pow(t, .7)) * (1 - t * .15);     // width: thin at both ends
  const nr = t => { const dx = 2 * bend * len * t, dy = -len, m = Math.hypot(dx, dy); return [-dy / m, dx / m]; };
  for (let i = 0; i <= N; i++) { const t = i / N, p = sp(t), n = nr(t), q = wd(t); A.push([p[0] + n[0] * q, p[1] + n[1] * q]); B.push([p[0] - n[0] * q, p[1] - n[1] * q]); }
  c.beginPath(); A.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]));
  for (let i = N; i >= 0; i--) c.lineTo(B[i][0], B[i][1]);
  c.closePath();
  const g = c.createLinearGradient(-w, 0, w, 0);
  g.addColorStop(0, 'rgb(24,88,36)'); g.addColorStop(.5, 'rgb(100,180,86)'); g.addColorStop(1, 'rgb(30,100,42)');
  c.fillStyle = g; c.fill(); c.strokeStyle = 'rgba(10,48,18,.7)'; c.lineWidth = 1.2; c.stroke();
  c.lineWidth = 1;
  for (let j = -3; j <= 3; j++) {
    c.strokeStyle = j ? 'rgba(200,245,170,.28)' : 'rgba(215,250,185,.75)'; c.beginPath();
    for (let i = 1; i < N; i++) { const t = i / N, p = sp(t), n = nr(t), q = wd(t) * j / 3.6, X = p[0] + n[0] * q, Y = p[1] + n[1] * q; i > 1 ? c.lineTo(X, Y) : c.moveTo(X, Y); }
    c.stroke();
  }
  c.restore();
}

// Rose leaf: several small toothed leaflets on one little branch
function leafRose(c, x, y, ang, len) {
  c.save(); c.translate(x, y); c.rotate(ang); c.lineCap = 'round';
  c.strokeStyle = 'rgb(44,112,54)'; c.lineWidth = 2.6; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -len); c.stroke();
  const leaflet = (px, py, a, s) => {
    c.save(); c.translate(px, py); c.rotate(a); c.beginPath();
    for (let i = 0; i < 44; i++) {                                              // egg shape with tiny teeth on the edge
      const th = i / 44 * 6.283, k = i % 2 ? 1 : .93;
      const X = Math.sin(th) * s * .3 * (1 + .2 * Math.cos(th)) * k, Y = ((1 - Math.cos(th)) / -2 + .5) * s * k - s / 2;
      i ? c.lineTo(X, Y) : c.moveTo(X, Y);
    }
    c.closePath();
    const g = c.createLinearGradient(-s * .3, 0, s * .3, 0);
    g.addColorStop(0, 'rgb(28,92,40)'); g.addColorStop(.5, 'rgb(88,166,78)'); g.addColorStop(1, 'rgb(34,104,46)');
    c.fillStyle = g; c.fill(); c.strokeStyle = 'rgba(12,54,22,.75)'; c.lineWidth = 1.2; c.stroke();
    c.strokeStyle = 'rgba(210,250,180,.65)'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -s * .95); c.stroke();
    c.lineWidth = 1; c.strokeStyle = 'rgba(210,250,180,.3)';
    for (let i = 1; i < 6; i++) { const yy = -s * i / 6.5, q = s * .2 * Math.sin(Math.PI * i / 6.5); c.beginPath(); c.moveTo(0, yy); c.lineTo(q, yy - s * .1); c.moveTo(0, yy); c.lineTo(-q, yy - s * .1); c.stroke(); }
    c.restore();
  };
  leaflet(0, -len, 0, len * .6);
  [-1, 1].forEach(sd => { leaflet(0, -len * .36, sd * 1.0, len * .46); leaflet(0, -len * .68, sd * .8, len * .52); });
  c.restore();
}

const flowers = [
  { x: 300, y: 175, draw: c => lily(c, 300, 175, 135, [255, 240, 225], [235, 170, 120], [200, 210, 90], 0) },
  { x: 180, y: 285, draw: c => lily(c, 180, 285, 125, [240, 140, 220], [150, 20, 110], [255, 230, 120], -.4) },
  { x: 420, y: 280, draw: c => lily(c, 420, 280, 122, [255, 215, 70], [225, 140, 10], [170, 190, 50], .5) },
  { x: 300, y: 370, draw: c => lily(c, 300, 370, 105, [255, 170, 120], [210, 80, 50], [200, 200, 80], .2) },
  { x: 205, y: 445, draw: c => rose(c, 205, 445, 62, [200, 20, 55]) },
  { x: 395, y: 440, draw: c => rose(c, 395, 440, 58, [255, 110, 160]) },
  { x: 300, y: 490, draw: c => rose(c, 300, 490, 54, [255, 190, 210]) },
  { x: 125, y: 390, draw: c => rose(c, 125, 390, 48, [225, 35, 80]) },
  { x: 480, y: 385, draw: c => rose(c, 480, 385, 48, [255, 140, 185]) }
];
// Stems: thicker at the bottom, thinner at the top, shaded like a round tube. Rose stems get thorns.
function stemsDraw(c) {
  c.lineCap = 'round'; c.lineJoin = 'round';
  const info = [];
  flowers.forEach((f, i) => {
    const rose = i > 3, sx = 300 + (f.x - 300) * .2 + rnd(-6, 6), sy = 640, N = 50, pts = [];
    const x1 = sx, y1 = sy - (sy - f.y) * .45, x2 = f.x - (f.x - sx) * .35, y2 = f.y + (sy - f.y) * .3;
    for (let j = 0; j <= N; j++) {                                  // an S-shaped curve from the soil up to the flower
      const t = j / N, u = 1 - t;
      pts.push({ x: u * u * u * sx + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * f.x,
                 y: u * u * u * sy + 3 * u * u * t * y1 + 3 * u * t * t * y2 + t * t * t * f.y });
    }
    pts.forEach((p, j) => { const a = pts[Math.max(0, j - 1)], b = pts[Math.min(N, j + 1)], m = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      p.tx = (b.x - a.x) / m; p.ty = (b.y - a.y) / m; p.nx = -p.ty; p.ny = p.tx; });
    const w0 = rose ? 9 : 11;
    const pass = (col, k, off) => { c.strokeStyle = col;           // dark edge, mid green, light highlight
      for (let j = 1; j <= N; j++) { const a = pts[j - 1], b = pts[j], w = w0 * (1 - j / N * .5);
        c.lineWidth = w * k; c.beginPath(); c.moveTo(a.x + a.nx * off * w, a.y + a.ny * off * w); c.lineTo(b.x + b.nx * off * w, b.y + b.ny * off * w); c.stroke(); } };
    pass('rgb(20,70,32)', 1, 0); pass('rgb(46,120,56)', .68, -.04); pass('rgb(122,196,112)', .2, -.2);
    if (rose) for (let j = 8; j < N - 6; j += 6) {                  // thorns
      const p = pts[j], sd = (j / 6) % 2 ? 1 : -1, w = w0 * (1 - j / N * .5) / 2;
      c.fillStyle = 'rgb(120,52,40)'; c.beginPath();
      c.moveTo(p.x + p.nx * sd * w - p.tx * 3, p.y + p.ny * sd * w - p.ty * 3);
      c.lineTo(p.x + p.nx * sd * (w + 9) - p.tx * 8, p.y + p.ny * sd * (w + 9) - p.ty * 8);
      c.lineTo(p.x + p.nx * sd * w + p.tx * 4, p.y + p.ny * sd * w + p.ty * 4); c.closePath(); c.fill();
    }
    info.push({ pts, rose });
  });
  info.forEach(({ pts, rose }, i) => {                              // leaves grow out of the stems
    const at = (t, side, len, bend) => { const p = pts[Math.round(t * 50)], sa = Math.atan2(p.tx, -p.ty);
      if (rose) leafRose(c, p.x, p.y, sa + side * rnd(.7, 1), len);
      else leafLily(c, p.x, p.y, sa + side * rnd(.5, .85), len, side * bend); };
    if (rose) { at(.16, i % 2 ? 1 : -1, rnd(70, 85)); at(.32, i % 2 ? -1 : 1, rnd(64, 78)); }
    else { const s0 = i % 2 ? 1 : -1; at(.1, s0, rnd(135, 155), rnd(.3, .5)); at(.2, -s0, rnd(135, 155), rnd(.3, .5)); at(.32, s0, rnd(115, 135), rnd(.3, .5)); at(.44, -s0, rnd(95, 115), rnd(.3, .5)); }
  });
  flowers.forEach(f => {                                            // small green bud under each flower
    const bg = c.createRadialGradient(f.x - 3, f.y - 4, 1, f.x, f.y, 13);
    bg.addColorStop(0, 'rgb(120,200,110)'); bg.addColorStop(1, 'rgb(28,100,44)');
    c.beginPath(); c.arc(f.x, f.y, 12, 0, R2); c.fillStyle = bg; c.fill();
  });
}

// Terracotta pot with soil on top
function potDraw(c) {
  const hg = (a, b) => { const g = c.createLinearGradient(a, 0, b, 0);
    g.addColorStop(0, '#9a4524'); g.addColorStop(.28, '#d9784a'); g.addColorStop(.5, '#ea9163'); g.addColorStop(.8, '#b45a31'); g.addColorStop(1, '#6e3019'); return g; };
  c.beginPath(); c.moveTo(195, 670); c.lineTo(405, 670); c.lineTo(375, 795); c.quadraticCurveTo(372, 808, 358, 808); c.lineTo(242, 808); c.quadraticCurveTo(228, 808, 225, 795); c.closePath();
  c.fillStyle = hg(195, 405); c.fill();
  const sg = c.createLinearGradient(0, 670, 0, 705); sg.addColorStop(0, 'rgba(0,0,0,.35)'); sg.addColorStop(1, 'rgba(0,0,0,0)');   // shadow under the rim
  c.fillStyle = sg; c.fill();
  c.beginPath(); c.moveTo(175, 636); c.lineTo(175, 664); c.quadraticCurveTo(175, 671, 184, 671); c.lineTo(416, 671); c.quadraticCurveTo(425, 671, 425, 664); c.lineTo(425, 636); c.closePath();
  c.fillStyle = hg(175, 425); c.fill(); c.strokeStyle = 'rgba(70,25,10,.55)'; c.lineWidth = 2; c.stroke();
  c.beginPath(); c.ellipse(300, 636, 125, 15, 0, 0, R2); c.fillStyle = '#c4673c'; c.fill(); c.stroke();
  const sg2 = c.createRadialGradient(300, 638, 5, 300, 638, 120); sg2.addColorStop(0, '#4a2f1c'); sg2.addColorStop(1, '#2a180d');
  c.beginPath(); c.ellipse(300, 637, 112, 11, 0, 0, R2); c.fillStyle = sg2; c.fill();
  c.fillStyle = 'rgba(120,80,50,.8)';
  for (let i = 0; i < 60; i++) { const a = Math.random() * R2, r = Math.sqrt(Math.random()); c.fillRect(300 + Math.cos(a) * r * 108, 637 + Math.sin(a) * r * 9, 2, 1.5); }  // soil crumbs
}

// ======== PART 3: Cut the painting into tiny pixels ========
// STEP = size of one pixel. Smaller = more pixels = more detail (2 on big screens, 3 on phones).
const STEP = innerWidth >= 900 ? 2 : 3;
const COLS = Math.ceil(W / STEP), ROWS = Math.ceil(H / STEP);
const board = document.createElement('canvas'); board.width = W; board.height = H;
const bc = board.getContext('2d', { willReadFrequently: true });
function grab(drawFn) {                       // paint one layer, then read one color per pixel-square
  bc.clearRect(0, 0, W, H); drawFn(bc);
  const d = bc.getImageData(0, 0, W, H).data, out = new Uint8Array(COLS * ROWS * 4);
  for (let gy = 0; gy < ROWS; gy++) for (let gx = 0; gx < COLS; gx++) {
    const x = Math.min(W - 1, gx * STEP + (STEP >> 1)), y = Math.min(H - 1, gy * STEP + (STEP >> 1));
    const i = (y * W + x) * 4, o = (gy * COLS + gx) * 4;
    out[o] = d[i]; out[o + 1] = d[i + 1]; out[o + 2] = d[i + 2]; out[o + 3] = d[i + 3];
  }
  return out;
}
// type 0 = grows up from the bottom, 1 = blooms outward from the flower's center, 2 = pops in (bow)
const groups = [{ k: 0, draw: potDraw }, { k: 0, full: true, draw: stemsDraw }];
flowers.forEach((f, i) => groups.push({ k: 1, cx: f.x, cy: f.y, st: 2.9 + i * .45, draw: f.draw }));
const samples = groups.map(g => grab(g.draw));

const covered = new Uint8Array(COLS * ROWS), parts = [];
for (let gi = groups.length - 1; gi >= 0; gi--) {   // go front-to-back so hidden pixels are skipped
  const g = groups[gi], s = samples[gi], list = []; let R = 1;
  for (let k = 0; k < COLS * ROWS; k++) {
    const a = s[k * 4 + 3]; if (a < 40 || (covered[k] && !g.full)) continue; if (a >= 230) covered[k] = 1;
    const x = (k % COLS) * STEP + STEP / 2, y = ((k / COLS) | 0) * STEP + STEP / 2;
    list.push({ x, y, col: s[k * 4] << 16 | s[k * 4 + 1] << 8 | s[k * 4 + 2], fa: Math.min(1, a / 255), k: g.k });
    if (g.k) R = Math.max(R, Math.hypot(x - g.cx, y - g.cy));
  }
  list.forEach(p => {                                // when does this pixel appear, and where does it start?
    if (g.k === 0) { p.dl = (H - p.y) / H * 2.0 + Math.random() * .5; p.du = .8; p.ox = p.x + (Math.random() - .5) * 8; p.oy = p.y + 30 + Math.random() * 30; }
    else {
      const rr = Math.hypot(p.x - g.cx, p.y - g.cy) / R; p.cx = g.cx; p.cy = g.cy;
      p.dl = g.st + (g.k === 1 ? Math.pow(rr, .9) * 1.5 + Math.random() * .4 : rr * .5 + Math.random() * .2);
      p.du = g.k === 1 ? .8 + rr * .7 : .8;
      p.ox = g.cx + (p.x - g.cx) * .1 + (Math.random() - .5) * 3; p.oy = g.cy + (p.y - g.cy) * .1 + (Math.random() - .5) * 3;
    }
  });
  parts[gi] = list;
}
const P = parts.flat();
const END = Math.max(...P.map(p => p.dl + p.du));

// ======== PART 4: PixiJS stage ========
const app = new PIXI.Application({ resizeTo: window, backgroundColor: 0x06040b, antialias: true,
  resolution: Math.min(window.devicePixelRatio || 1, 2), autoDensity: true });
document.body.prepend(app.view);
const root = new PIXI.Container(), bouquet = new PIXI.Container(), sway = new PIXI.Container();
sway.pivot.set(G.x, G.y); sway.position.set(G.x, G.y);
app.stage.addChild(root); root.addChild(bouquet);
root.filterArea = app.screen;
const ascii = new PIXI.Filter(undefined, FRAG, { pixelSize: 6 });
root.filters = [ascii];

// every pixel is a tiny square sprite
const pc = new PIXI.ParticleContainer(P.length + 10, { position: true, tint: true }, 16384, true);
P.forEach(p => {
  const s = new PIXI.Sprite(PIXI.Texture.WHITE);
  s.anchor.set(.5); s.width = s.height = STEP + .6; s.tint = p.col; s.alpha = 0; s.position.set(p.ox, p.oy);
  pc.addChild(s); p.s = s; p.done = false;
});
sway.addChild(pc);

const sparks = [];
for (let i = 0; i < 40; i++) {
  const g = new PIXI.Graphics(); g.beginFill([0xffe9a8, 0xffb3d1, 0xffffff][i % 3]); g.drawCircle(0, 0, 1.5 + (i % 3));
  g.position.set(-80 + Math.random() * 760, Math.random() * 860);
  sparks.push({ g, vy: .15 + Math.random() * .35, ph: Math.random() * 6 }); bouquet.addChild(g);
}
bouquet.addChild(sway);

function layout() {
  const sw = app.screen.width, sh = app.screen.height * .88, s = Math.min(sw / W, sh / H);
  bouquet.scale.set(s); bouquet.position.set((sw - W * s) / 2, (sh - H * s) / 2);
  ascii.uniforms.pixelSize = Math.max(5, Math.round(3 + 3 * s));   // small letters = lots of detail
}
layout(); app.renderer.on('resize', layout);

// ======== PART 5: Animation ========
const ease = (u, k) => k === 2 ? 1 + 2.70158 * Math.pow(u - 1, 3) + 1.70158 * Math.pow(u - 1, 2) : 1 - Math.pow(1 - u, 3);
const cap = document.getElementById('cap');
let t = 0;
app.ticker.add(() => {
  t += Math.min(app.ticker.deltaMS, 50) / 1000;
  if (t < END + .2) for (const p of P) {
    const u = (t - p.dl) / p.du; if (u <= 0) continue;
    if (u >= 1) { if (!p.done) { p.s.x = p.x; p.s.y = p.y; p.s.alpha = p.fa; p.done = true; } continue; }
    const e = ease(u, p.k); let x = p.ox + (p.x - p.ox) * e, y = p.oy + (p.y - p.oy) * e;
    if (p.k === 1) { const a = (1 - e) * .9, dx = x - p.cx, dy = y - p.cy, ca = Math.cos(a), sa = Math.sin(a); x = p.cx + dx * ca - dy * sa; y = p.cy + dx * sa + dy * ca; } // petals twist open
    p.s.x = x; p.s.y = y; p.s.alpha = p.fa * Math.min(1, u * 5); p.done = false;
  }
  if (t > END - 1) cap.style.opacity = 1;
  sway.rotation = Math.sin(t * .6) * .012 * Math.min(1, t / 6);
  sparks.forEach(p => {
    p.g.y -= p.vy; p.g.x += Math.sin(t + p.ph) * .2; p.g.alpha = .4 + .6 * Math.abs(Math.sin(t * 1.5 + p.ph));
    if (p.g.y < -30) p.g.y = H + 30;
  });
});

let on = true;
addEventListener('pointerdown', e => {
  if (e.target.closest('#cap,#rp')) return;
  on = !on; root.filters = on ? [ascii] : null;
});
document.getElementById('rp').onclick = () => { t = 0; cap.style.opacity = 0; P.forEach(p => { p.done = false; p.s.alpha = 0; }); };
</script>
</body>
</html>
